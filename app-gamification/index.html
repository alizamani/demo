}

.form-range::-moz-range-thumb {

.form-range:focus-visible::-moz-range-thumb {

}

.form-range:disabled {

}

.btn:not(.btn-primary, .viz-tile):is(

  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;field-quest-android&quot;&gt;
  &lt;style&gt;
    #field-quest-android {
      --fq-positive: var(--viz-series-2);
      --fq-warning: var(--viz-series-3);
      color: var(--foreground);
      display: grid;
      place-items: start center;
      width: 100%;
    }

    #field-quest-android * {
      box-sizing: border-box;
    }

    #field-quest-android .fq-phone {
      width: min(100%, 420px);
      background: var(--background);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 45px color-mix(in srgb, var(--foreground) 12%, transparent);
    }

    #field-quest-android .fq-statusbar,
    #field-quest-android .fq-appbar,
    #field-quest-android .fq-section-head,
    #field-quest-android .fq-list-row,
    #field-quest-android .fq-person,
    #field-quest-android .fq-nav,
    #field-quest-android .fq-inline,
    #field-quest-android .fq-chart-labels,
    #field-quest-android .fq-points-row {
      display: flex;
      align-items: center;
    }

    #field-quest-android .fq-statusbar,
    #field-quest-android .fq-appbar,
    #field-quest-android .fq-section-head,
    #field-quest-android .fq-list-row,
    #field-quest-android .fq-chart-labels,
    #field-quest-android .fq-points-row {
      justify-content: space-between;
    }

    #field-quest-android .fq-statusbar {
      padding: 10px 20px 6px;
    }

    #field-quest-android .fq-status-icons {
      display: flex;
      gap: 7px;
    }

    #field-quest-android .fq-status-icons svg {
      width: 14px;
      height: 14px;
    }

    #field-quest-android .fq-appbar {
      padding: 10px 18px 16px;
    }

    #field-quest-android .fq-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #field-quest-android .fq-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: var(--primary-foreground);
      background:
        radial-gradient(circle at 35% 50%, var(--viz-series-3) 0 14%, transparent 15%),
        radial-gradient(circle at 65% 50%, var(--viz-series-1) 0 14%, transparent 15%),
        var(--primary);
    }

    #field-quest-android .fq-profile {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--secondary);
      color: var(--secondary-foreground);
      border: 1px solid var(--border);
    }

    #field-quest-android .fq-app-actions,
    #field-quest-android .fq-language {
      display: flex;
      align-items: center;
    }

    #field-quest-android .fq-app-actions {
      gap: 8px;
    }

    #field-quest-android .fq-language {
      gap: 3px;
    }

    #field-quest-android .fq-content {
      padding: 0 16px 18px;
    }

    #field-quest-android .fq-screen[hidden] {
      display: none;
    }

    #field-quest-android .fq-screen {
      display: grid;
      gap: 14px;
    }

    #field-quest-android h2,
    #field-quest-android h3,
    #field-quest-android p {
      margin: 0;
    }

    #field-quest-android .fq-muted {
      color: var(--muted-foreground);
    }

    #field-quest-android .fq-hero {
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--viz-series-1) 18%, var(--card)), var(--card));
    }

    #field-quest-android .fq-kicker {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    #field-quest-android .fq-ring {
      width: 92px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--viz-series-1) 0 95%, var(--muted) 95% 100%);
      position: relative;
    }

    #field-quest-android .fq-ring::after {
      content: &quot;&quot;;
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: var(--card);
    }

    #field-quest-android .fq-ring-value {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    #field-quest-android .fq-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    #field-quest-android .fq-mini-card {
      padding: 13px 10px;
      text-align: center;
    }

    #field-quest-android .fq-mini-card svg {
      color: var(--viz-series-1);
      margin-bottom: 5px;
    }

    #field-quest-android .fq-section-head {
      gap: 12px;
    }

    #field-quest-android .fq-activity-card,
    #field-quest-android .fq-challenge,
    #field-quest-android .fq-quality,
    #field-quest-android .fq-points-card {
      padding: 16px;
    }

    #field-quest-android .fq-bars {
      height: 120px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: end;
      gap: 8px;
      padding-top: 16px;
      border-bottom: 1px solid var(--border);
    }

    #field-quest-android .fq-bar-wrap {
      height: 100%;
      display: flex;
      align-items: end;
      justify-content: center;
    }

    #field-quest-android .fq-bar {
      width: min(24px, 72%);
      min-height: 4px;
      border-radius: 7px 7px 2px 2px;
      background: var(--viz-series-1);
      position: relative;
    }

    #field-quest-android .fq-bar.is-zero {
      background: var(--muted);
    }

    #field-quest-android .fq-bar::before {
      content: attr(data-value);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 5px);
      transform: translateX(-50%);
      color: var(--muted-foreground);
    }

    #field-quest-android .fq-chart-labels {
      padding-top: 7px;
    }

    #field-quest-android .fq-chart-labels span {
      width: calc(100% / 7);
      text-align: center;
    }

    #field-quest-android .fq-progress {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--muted);
      margin: 10px 0 8px;
    }

    #field-quest-android .fq-progress &gt; span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--viz-series-1);
    }

    #field-quest-android .fq-segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: var(--muted);
      border-radius: 12px;
    }

    #field-quest-android .fq-segmented .btn {
      width: 100%;
      justify-content: center;
    }

    #field-quest-android .fq-podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 8px;
      padding-top: 8px;
    }

    #field-quest-android .fq-podium-person {
      text-align: center;
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    #field-quest-android .fq-medal {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--secondary);
      color: var(--secondary-foreground);
      border: 3px solid var(--border);

    #field-quest-android .fq-podium-person.is-first .fq-medal {

      height: 66px;

    }

    #field-quest-android .fq-rank {

      height: 28px;

      display: grid;
      place-items: center;

      gap: 3px;

      align-items: center;

      width: 92px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--fq-positive) 0 100%, var(--muted) 100%);
      position: relative;
    }

    #field-quest-android .fq-quality-ring::after {
      content: &quot;&quot;;
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--card);

    #field-quest-android .fq-quality-ring span {
      position: relative;
      z-index: 1;
    }

      display: grid;
      gap: 9px;

      align-items: center;

    #field-quest-android .fq-check svg {
      color: var(--fq-positive);

    }

    #field-quest-android .fq-badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    #field-quest-android .fq-achievement {
      padding: 15px;
      text-align: center;
      min-height: 132px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 7px;
    }

      opacity: .55;
    }

    #field-quest-android .fq-achievement-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;

      place-items: center;
      background: color-mix(in srgb, var(--viz-series-3) 22%, var(--card));

    #field-quest-android .fq-challenge-head {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    #field-quest-android .fq-challenge-head svg {
      color: var(--viz-series-1);
      flex: 0 0 auto;
    }

    #field-quest-android .fq-points-card {
      display: grid;
      gap: 11px;
    }

    #field-quest-android .fq-points-row {
      gap: 10px;
    }

    #field-quest-android .fq-rule-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--secondary-foreground);
      background: var(--secondary);
      flex: 0 0 auto;
    }

    #field-quest-android .fq-rule-copy {
      flex: 1;
    }

    #field-quest-android .fq-nav {
      border-top: 1px solid var(--border);
      padding: 8px 7px 10px;
      justify-content: space-around;
      background: var(--background);
    }

    #field-quest-android .fq-nav .btn {
      min-width: 0;
      flex: 1;
      display: grid;
      justify-items: center;
      gap: 3px;
      padding-inline: 4px;

    #field-quest-android .fq-inline {
      gap: 6px;
    }

    #field-quest-android .fq-success {
      color: var(--fq-positive);

    @media (max-width: 360px) {
      #field-quest-android .fq-content {
        padding-inline: 12px;

      #field-quest-android .fq-hero {

      #field-quest-android .fq-ring {
        width: 84px;
      }

      #field-quest-android .fq-quality-grid {
        grid-template-columns: 1fr;
      }
    }

      const translatableTextNodes = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);

        if (parentTag !== &quot;SCRIPT&quot; &amp;&amp; parentTag !== &quot;STYLE&quot; &amp;&amp; englishText[trimmed]) {

            node: textNode,
            prefix: match[1],

            en: englishText[trimmed],

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
