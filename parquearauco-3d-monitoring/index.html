<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parque Arauco 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a13; --panel:rgba(10,16,30,.74); --panel2:rgba(18,27,48,.82);
  --line:rgba(150,200,255,.13); --line2:rgba(150,200,255,.24);
  --text:#e9effc; --dim:#8d9bb8; --faint:#5d6a86; --accent:#72e6ff;
  --ok:#36e39a; --busy:#ff7a59; --warn:#ffb648; --alert:#ff3b5c; --info:#4fb4ff; --beacon:#a98bff;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none}
.fx-vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,4,10,.55) 100%)}
.fx-grain{position:fixed;inset:-50%;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* letterbox */
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:30;transition:height 1.1s cubic-bezier(.7,0,.2,1);pointer-events:none;display:flex;align-items:center;justify-content:center}
.lb.top{top:0}.lb.bot{bottom:0}
body.cine .lb{height:10vh}
.lb .cap{font-size:clamp(13px,1.6vw,19px);letter-spacing:.04em;color:#dfe8ff;opacity:0;transition:opacity .8s;text-align:center;padding:0 24px}
.lb .cap b{color:var(--accent);font-weight:600}
.lb .cap.on{opacity:1}

/* intro */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1.4s}
#intro.gone{opacity:0}
#intro h1{margin:0;font-weight:800;font-size:clamp(34px,7vw,96px);letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;color:#eef8ff;text-shadow:0 0 40px rgba(114,230,255,.45),0 0 2px rgba(255,255,255,.6);white-space:nowrap}
#intro h1 span{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(8px);animation:letter .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
#intro p{margin:18px 0 0;color:var(--dim);letter-spacing:.42em;text-transform:uppercase;font-size:clamp(10px,1.1vw,13px);opacity:0;animation:fadein 1.2s 1.6s forwards}
#intro .rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-top:22px;animation:rule 1.6s 1.2s forwards}
@keyframes rule{to{width:min(420px,70vw)}}
@keyframes fadein{to{opacity:1}}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.2em;background:var(--bg);transition:opacity .6s}
#loading.gone{opacity:0;pointer-events:none}
#skip{position:fixed;right:24px;bottom:calc(10vh + 16px);z-index:41;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--dim);cursor:pointer;transition:opacity .6s}
#skip:hover{color:var(--text)}

/* ui shell */
.ui{position:fixed;z-index:20;transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
body.pre .ui{opacity:0;pointer-events:none}
body.pre .ui.left{transform:translateX(-20px)} body.pre .ui.right{transform:translateX(20px)}
body.cine .ui.hide-cine{opacity:0;pointer-events:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.35)}

#brand{top:18px;left:20px;display:flex;align-items:center;gap:12px}
#brand .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgba(114,230,255,.25),rgba(169,139,255,.18));border:1px solid var(--line2);display:grid;place-items:center}
#brand b{display:block;font-size:13px;letter-spacing:.24em;font-weight:700}
#brand small{display:block;font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.02em}
#brand .demo{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid rgba(255,182,72,.35);border-radius:6px;padding:2px 6px;margin-left:4px;letter-spacing:.06em}

#crumbs{top:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px 8px;font-size:12.5px;white-space:nowrap}
body.pre #crumbs{transform:translate(-50%,-10px)}
#crumbs button{background:none;border:0;padding:5px 9px;border-radius:8px;color:var(--dim);cursor:pointer}
#crumbs button:hover{background:rgba(255,255,255,.06);color:var(--text)}
#crumbs button.cur{color:var(--text);font-weight:600}
#crumbs i{color:var(--faint);font-style:normal}

#status{top:18px;right:20px;display:flex;align-items:center;gap:14px;padding:9px 14px;font-size:12px}
#status .live{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.12em;font-size:11px}
#status .live i{width:7px;height:7px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 0 rgba(255,59,92,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,59,92,0)}100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}}
#status .clock{font-family:var(--mono);color:var(--text)}
#status .sep{width:1px;height:16px;background:var(--line2)}
#status .dim{color:var(--dim)}

#floors{left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px;width:206px}
body.pre #floors{transform:translate(-20px,-50%)}
.fbtn{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;transition:background .25s,border-color .25s}
.fbtn:hover{background:rgba(255,255,255,.05)}
.fbtn.on{background:rgba(114,230,255,.09);border-color:rgba(114,230,255,.35)}
.fbtn .n{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.fbtn .n small{font-size:11px;font-weight:600;color:var(--dim);margin-right:1px}
.fbtn .t{font-size:12px;line-height:1.25}
.fbtn .t span{display:block;color:var(--dim);font-size:11px;margin-top:2px;font-family:var(--mono)}
.fbtn .a{box-sizing:border-box;min-width:22px;height:20px;border-radius:10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;flex-shrink:0;padding:0 7px;background:rgba(255,59,92,.16);color:#ff8095;border:1px solid rgba(255,59,92,.35)}
.fbtn .a.z{background:rgba(54,227,154,.1);color:var(--ok);border-color:rgba(54,227,154,.25)}
.fbtn.all .n{font-size:13px;letter-spacing:.08em}
.fsep{height:1px;background:var(--line);margin:2px 6px}

#panel{right:20px;top:72px;bottom:86px;width:360px;display:flex;flex-direction:column;overflow:hidden}
#panel .hd{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
#panel .hd .ey{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
#panel .hd h2{margin:6px 0 2px;font-size:20px;font-weight:700;letter-spacing:-.01em}
#panel .hd p{margin:0;color:var(--dim);font-size:12px;line-height:1.45}
#panel .bd{overflow:auto;padding:14px 18px 18px;flex:1;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:66px}
.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.alert{border-left-color:var(--alert)} .kpi.info{border-left-color:var(--info)} .kpi.beacon{border-left-color:var(--beacon)}
.kpi.wide{grid-column:1/-1}
h3{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
h3:first-child{margin-top:0}
h3 em{font-style:normal;color:var(--faint);letter-spacing:.04em;text-transform:none;font-family:var(--mono)}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .2s}
.row:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.35}
.row .tx small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:rgba(54,227,154,.12);color:var(--ok)} .pill.warn{background:rgba(255,182,72,.13);color:var(--warn)} .pill.alert{background:rgba(255,59,92,.15);color:#ff7d92} .pill.busy{background:rgba(255,122,89,.13);color:var(--busy)} .pill.info{background:rgba(79,180,255,.13);color:var(--info)} .pill.beacon{background:rgba(169,139,255,.14);color:var(--beacon)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--info),var(--accent))}
table.sens{width:100%;border-collapse:collapse;font-size:11.5px}
table.sens th{text-align:left;font-weight:600;color:var(--faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 6px;border-bottom:1px solid var(--line)}
table.sens td{padding:7px 6px;border-bottom:1px solid rgba(150,200,255,.06);vertical-align:top}
table.sens tr{cursor:pointer}
table.sens tr:hover td{background:rgba(255,255,255,.04)}
table.sens td.m{font-family:var(--mono);color:var(--dim);font-size:10.5px}
table.sens td .sd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.feed .row{cursor:default}
.feed .row[data-go]{cursor:pointer}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.spark{width:100%;height:70px;display:block;margin:10px 0 4px}
.note{font-size:11.5px;color:var(--dim);line-height:1.5;margin:10px 0 0}
.backbtn{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);cursor:pointer}
.backbtn:hover{background:rgba(114,230,255,.12);border-color:rgba(114,230,255,.4)}
.backbtn kbd{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
#status .lang{display:flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:8px;padding:2px}
#status .lang button{background:none;border:0;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--dim);cursor:pointer}
#status .lang button:hover{color:var(--text)}
#status .lang button[aria-pressed="true"]{background:rgba(114,230,255,.16);color:var(--accent)}
#legend b{font-weight:inherit}
.pksign{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ok);background:rgba(6,12,22,.85);border:1px solid rgba(54,227,154,.5);border-radius:8px;padding:5px 12px 5px 5px;white-space:nowrap;box-shadow:0 0 24px rgba(54,227,154,.25)}
.pksign b{background:#2f6fff;color:#fff;border-radius:5px;padding:2px 8px;font-size:15px}
.linkbtn{background:rgba(114,230,255,.08);border:1px solid rgba(114,230,255,.3);color:var(--accent);border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;margin-top:12px}
.linkbtn:hover{background:rgba(114,230,255,.15)}

#tools{bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px}
body.pre #tools{transform:translate(-50%,14px)}
.tb{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap;transition:all .2s}
.tb:hover{color:var(--text);background:rgba(255,255,255,.05)}
.tb[aria-pressed="true"]{color:var(--text);background:rgba(114,230,255,.1);border-color:rgba(114,230,255,.32)}
.tb svg{width:15px;height:15px;flex:none}
.tb kbd{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.tb.primary{color:#04121a;background:linear-gradient(135deg,#8af0ff,#5fb8ff);font-weight:600}
.tb.primary:hover{color:#04121a;filter:brightness(1.08)}
.tb.primary[aria-pressed="true"]{background:linear-gradient(135deg,#ff9bb0,#ff5f7e);border-color:transparent}

#legend{left:20px;bottom:20px;padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:11px;color:var(--dim)}
#legend span{display:flex;align-items:center;gap:7px;white-space:nowrap}
#legend i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
#legend i.cap{border-radius:4px;width:6px;height:11px}

#toasts{position:fixed;right:20px;top:72px;z-index:25;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:360px}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;font-size:12px;line-height:1.4;cursor:pointer;animation:tin .5s cubic-bezier(.2,.8,.2,1);border-left:3px solid var(--alert)}
.toast.ok{border-left-color:var(--ok)}
.toast b{display:block;font-size:12.5px}
.toast small{color:var(--dim)}
.toast.out{animation:tout .5s forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
body.panel-open #toasts{right:392px}

#tip{position:fixed;z-index:35;pointer-events:none;padding:8px 11px;font-size:12px;line-height:1.4;opacity:0;transition:opacity .15s;transform:translate(14px,14px);max-width:260px}
#tip.on{opacity:1}
#tip small{display:block;color:var(--dim);font-size:11px}

/* 3D labels */
.flbl{display:flex;align-items:center;gap:10px;white-space:nowrap;cursor:pointer;pointer-events:auto;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(8,13,26,.62);border:1px solid var(--line2);backdrop-filter:blur(6px);font-size:12px;transition:opacity .5s}
.flbl b{background:rgba(114,230,255,.14);color:var(--accent);border-radius:999px;padding:4px 9px;font-size:12px}
.flbl em{font-style:normal;color:var(--dim);font-family:var(--mono);font-size:11px}
.flbl .fa{color:#ff8095}
.slbl{font-size:10.5px;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:6px;background:rgba(8,13,26,.7);border:1px solid var(--line);color:#cfd9ef;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .4s}
.slbl:hover{border-color:var(--accent);color:#fff}
.slbl i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.slbl.bath{font-size:11px;padding:4px 9px;border-color:var(--line2)}
.slbl.bath em{font-style:normal;font-family:var(--mono);font-weight:400;color:var(--dim)}
.sval{font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:4px;background:rgba(6,10,20,.78);color:#d7e3fb;white-space:nowrap;border:1px solid rgba(255,255,255,.08);pointer-events:auto;cursor:pointer;margin-top:-14px}
.sval.alert{color:#ff8ea0;border-color:rgba(255,59,92,.5)} .sval.warn{color:var(--warn);border-color:rgba(255,182,72,.4)} .sval.ok{color:var(--ok)} .sval.busy{color:var(--busy)} .sval.beacon{color:var(--beacon)} .sval.info{color:var(--info)}
.stag{font-family:var(--mono);font-size:9.5px;color:#d9c9ff;background:rgba(80,50,160,.55);border:1px solid rgba(169,139,255,.5);border-radius:4px;padding:1px 5px;margin-top:-8px;white-space:nowrap}

#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:var(--bg);color:var(--dim);text-align:center;padding:24px;font-size:14px;line-height:1.6}

@media (max-width:900px){
  #floors{top:auto;bottom:74px;left:12px;right:12px;transform:none;width:auto;flex-direction:row;overflow-x:auto;padding:6px}
  body.pre #floors{transform:translateY(14px)}
  .fbtn{grid-template-columns:auto auto;padding:6px 10px;gap:6px}
  .fbtn .t span,.fsep{display:none}
  .fbtn .t{font-size:11px;white-space:nowrap}
  #panel{left:12px;right:12px;width:auto;top:auto;bottom:140px;height:38vh}
  #crumbs{display:none}
  #legend{display:none}
  #tools{left:12px;right:12px;transform:none;bottom:12px;overflow-x:auto;justify-content:flex-start}
  body.pre #tools{transform:translateY(14px)}
  .tb kbd{display:none}
  #brand{left:12px;top:12px} #brand small{display:none}
  #status{right:12px;top:12px;padding:7px 10px;gap:8px} #status .hide-s{display:none}
  #toasts{left:12px;right:12px;width:auto;top:62px}
  body.panel-open #toasts{right:12px}
  #floors,#tools{scrollbar-width:none} #floors::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}
  #panel{height:32vh}
  .flbl{display:none}
}
@media (max-width:520px){
  #brand > div:last-child{display:none}
  .toast:nth-child(n+2){display:none}
}
@media (prefers-reduced-motion:reduce){.fx-grain{animation:none}}
</style>
<script>
window.__errs = [];
addEventListener('error', e => { window.__errs.push(String(e.message || e.error)); const el = document.getElementById('loading'); if (el) el.textContent = 'ERROR: ' + (e.message || e.error); });
addEventListener('unhandledrejection', e => { window.__errs.push(String(e.reason)); });
</script>
<script type="importmap">

</script>

<body class="pre">
<div id="stage"></div>
<div id="labels"></div>
<div class="fx-vignette"></div>
<div class="fx-grain"></div>

<div class="lb top"></div>
<div class="lb bot"><div class="cap" id="cap"></div></div>

<div id="loading" data-i18n="loading">CARGANDO MODELO…</div>
<div id="intro">
  <h1 id="introTitle"></h1>
  <div class="rule"></div>
  <p data-i18n="introSub">Gemelo digital · Sensores en tiempo real</p>
</div>
<button id="skip" data-i18n="skip">Saltar intro ›</button>

<div id="brand" class="ui left hide-cine">
  <div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#72e6ff" stroke-width="1.6"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-5h6v5"/><path d="M12 8.5v.01" stroke-linecap="round" stroke-width="2.4"/></svg></div>
  <div><b>PARQUE ARAUCO</b><small><span data-i18n="brandSub">Gemelo digital · Operaciones y aseo</span> <span class="demo" data-i18n="demo">DEMO · DATOS SIMULADOS</span></small></div>
</div>

<nav id="crumbs" class="ui glass hide-cine"></nav>

<div id="status" class="ui right glass">
  <span class="live"><i></i><span data-i18n="live">EN VIVO</span></span><span class="sep"></span>

    F.pmesh.visible = state.people && F.cur.op > .2;
    for (const st of F.staff) st.g.visible = F.cur.op > .2;
    for (const scr of F.screens) { const k = (Math.sin(clockT * 1.7 + scr.position.x) * .5 + .5); scr.material.color.setRGB(.6 + k * .9, .7 + Math.sin(clockT * .6 + scr.position.x * .3) * .3, 1.2 + k * .6); }
  }
  // camera
  applyViewOffset(dt);
  parkingFrame(dt);
  if (camTween) {
    const k = clamp((clockT - camTween.start) / camTween.dur, 0, 1), e = ease(k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); camera.position.y += Math.sin(Math.PI * e) * camTween.p0.distanceTo(camTween.p1) * camTween.arc;
    controls.target.lerpVectors(camTween.t0, camTween.t1, e); camera.lookAt(controls.target);
    if (k >= 1) { camTween = null; controls.enabled = true; controls.update(); }
  } else {
    controls.autoRotate = !REDUCED && (state.tour || (!state.intro && clockT - lastInteract > 8 && !state.section));
    controls.update();
  }
  // tour
  if (state.tour) { tourT += dt; if (tourT > TOUR[tourI].dur) { tourI = (tourI + 1) % TOUR.length; runShot(); } }
  // sensors pulse
  for (const F of floors) {
    if (!F.group.visible) continue;
    for (const s of F.sensors) {
      const alert = s.state === 'alert', sp = alert ? 1.3 : s.state === 'warn' ? .8 : .42;
      const ph = (clockT * sp + s.phase) % 1, sc = alert ? .3 + ph * 2.2 : .2 + ph * (s.type === 'beacon' ? .6 : 1.0);
      v3.copy(s.pos); s3.set(sc, sc, sc); m4.compose(v3, q0, s3); F.rings.setMatrixAt(s.idx, m4);
      const fade = Math.pow(1 - ph, 1.6) * (alert ? 2.6 : s.state === 'warn' ? 1.6 : s.type === 'beacon' ? .45 : .8);
      tmpC.copy(SCOL[s.state]).multiplyScalar(fade); F.rings.setColorAt(s.idx, tmpC);
    }
    F.rings.instanceMatrix.needsUpdate = true; F.rings.instanceColor.needsUpdate = true;
  }
  // beams
  beamMat.uniforms.time.value = clockT;
  for (const [id, b] of beams) {
    const u = b.userData.mat.uniforms; u.time.value = clockT;
    const born = clamp((clockT - b.userData.born) / .8, 0, 1), dying = b.userData.dying ? clamp(1 - (clockT - b.userData.dying) / .8, 0, 1) : 1;
    u.opacity.value = born * dying * sensors[id].F.cur.op;
    if (b.userData.dying && dying <= 0) { b.parent.remove(b); b.userData.mat.dispose(); beams.delete(id); }
  }
  // people
  for (const F of floors) {
    if (!F.pmesh.visible) continue;
    const escY = !F.escGroup.visible;
    F.people.forEach((p, k) => {
      let x, z, y = SLAB, sc = 1;
      if (p.mode === 'ring') { p.t += p.sp * dt; [x, z] = ringPt(p.t, p.A, p.B); }
      else if (p.mode === 'wander') {
        if (p.wait > 0) { p.wait -= dt; if (p.wait <= 0) { p.tx = R(-49, -27); p.tz = R(-16, 16); } }
        else { const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz); if (d < .3) p.wait = R(3, 12); else { p.x += dx / d * 1.1 * dt; p.z += dz / d * 1.1 * dt; } }
        x = p.x; z = p.z;
      } else if (p.mode === 'bridge') { p.z += p.dir * 1.15 * dt; if (Math.abs(p.z) > 11) p.dir *= -1; x = p.x; z = p.z; }
      else if (p.mode === 'esc') {
        const e = F.esc[p.e]; p.s = (p.s + dt * .05) % 1;
        x = lerp(e.xb, e.xt, p.s); z = e.zE + p.lane; y = SLAB + FH * p.s + .3; if (escY) sc = 0;
      }
      if (p.mode !== 'esc') y += Math.abs(Math.sin(clockT * 7 + p.ph)) * .05;
      p.wx = x; p.wz = z;
      v3.set(x, y, z); s3.set(sc, sc, sc); m4.compose(v3, q0, s3); F.pmesh.setMatrixAt(k, m4);
    });
    F.pmesh.instanceMatrix.needsUpdate = true;
  }
  // staff
  for (const F of floors) for (const st of F.staff) {
    let x, z;
    const jb = st.job;
    if (st.mode === 'patrol') { st.t += .03 * dt;[x, z] = ringPt(st.t, st.A, st.B); }
    else if (st.mode === 'go') { const d = angDiff(jb.tt, st.t), step = Math.sign(d) * Math.min(Math.abs(d), .2 * dt); st.t += step;[x, z] = ringPt(st.t, st.A, st.B); if (Math.abs(d) < .005) { st.mode = 'enter'; st.k = 0; st.from.set(x, SLAB, z); } }
    else if (st.mode === 'enter') { st.k += dt / 2.2; const e = ease(clamp(st.k, 0, 1)); x = lerp(st.from.x, jb.door.x, e); z = lerp(st.from.z, jb.door.z, e); if (st.k >= 1) { st.mode = 'clean'; st.timer = R(6, 9); } }
    else if (st.mode === 'clean') { st.timer -= dt; x = jb.door.x + Math.sin(clockT * 1.3) * .5; z = jb.door.z + Math.cos(clockT * 1.1) * .4; if (st.timer <= 0) { st.back = { x, z }; st.mode = 'exit'; st.k = 0; resolveJob(st); } }
    else if (st.mode === 'exit') { st.k += dt / 2.2; const e = ease(clamp(st.k, 0, 1)); x = lerp(st.back.x, st.from.x, e); z = lerp(st.back.z, st.from.z, e); if (st.k >= 1) st.mode = 'patrol'; }
    st.g.position.set(x, SLAB, z);
    st.halo.scale.setScalar(1 + Math.sin(clockT * 4) * .15);
  }
  // elevators + atrium light
  const topVis = floors.filter(F => F.cur.op > .5).reduce((a, F) => Math.max(a, F.cur.y), 0);
  const coreOn = !state.explode && !state.parking;
  core.visible = coreOn;
  for (const el of elevators) {
    el.shaft.scale.y = topVis + FH * .92;
    const tf = Math.min(el.floor, state.floor === null ? 3 : state.floor), ty = floors[tf].cur.y + SLAB;
    if (Math.abs(el.y - ty) < .05) { el.wait -= dt; if (el.wait <= 0) { el.floor = (el.floor + 1 + (rng() * 2 | 0)) % 4; el.wait = R(2.5, 5); } }
    else el.y += clamp(ty - el.y, -2.4 * dt, 2.4 * dt);
    el.cab.position.y = el.y;
  }
  shaftLight.scale.y = topVis + FH + 4; shaftLight.material.uniforms.opacity.value = damp(shaftLight.material.uniforms.opacity.value, state.floor === null && !state.explode ? 1 : 0, 2, dt);
  // traffic
  traffic.forEach((c, k) => { c.x += c.v * dt; if (c.x > 1500) c.x = -1500; if (c.x < -1500) c.x = 1500; m4.makeTranslation(c.x, .6, c.z); tl.setMatrixAt(k, m4); });
  tl.instanceMatrix.needsUpdate = true;
  // selection pulse
  selBox.material.opacity = .55 + Math.sin(clockT * 3) * .25;
  // heat + sim
  if (state.heat && clockT - lastHeat > .3) { lastHeat = clockT; for (const F of floors) if (F.heat.visible) drawHeat(F); }
  if (clockT - lastTick > 1) { lastTick = clockT; $('#clock').textContent = clockFmt.format(new Date()); tick(); }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; applyViewOffset();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

/* go */
introTitle();
applyLang();
tick(true);
for (const s of sensors) evalSensor(s);
tick(true);
$('#loading').classList.add('gone');
document.body.classList.add('cine');
introStart = 0; clockT = 0;
{ const [p, t] = overviewCam(); camera.position.set(-250, 40, 320); controls.target.set(0, 14, 0); camera.lookAt(controls.target); flyTo(p, t, REDUCED ? .01 : 7.4, .05); }
refreshNav();
window.__demo = { camera, controls, state, floors, sections, sensors, goFloor, goSection, goOverview, startTour, stopTour, toggle, endIntro, setLang };
requestAnimationFrame(frame);
</script>
